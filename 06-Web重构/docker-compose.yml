# OZON 云端看板 — 本地开发 / 单机部署编排
# 用法:  docker compose up -d --build
# 访问:  http://localhost:80  (前端)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ozon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ozon_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-ozon_dashboard}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ozon}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-ozon}:${POSTGRES_PASSWORD:-ozon_pwd}@db:5432/${POSTGRES_DB:-ozon_dashboard}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-0000000000}
      ROOT_USERNAME: ${ROOT_USERNAME:-admin}
      ROOT_PASSWORD: ${ROOT_PASSWORD:-admin123}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata:
